[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offboard-mcp"
version = "0.1.0"
description = "MCP server exposing Offboard Studio node/architecture primitives to LLM clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Offboard Studio" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
offboard-mcp = "offboard_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"offboard_mcp" = ["py.typed"]
